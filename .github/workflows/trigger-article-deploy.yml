name: trigger-article-deploy

# 本体（blog）を更新したら、記事リポジトリ（blog-article）の deploy を起動する。
# blog-article 側は Hugo が本体を取り込んでビルドするため、本体の変更を反映するには再ビルドが要る。
on:
  push:
    branches: [main]
    # サイトの見た目・挙動に関わるファイルだけで起動する（memo/docs/README の変更では再ビルドしない）
    paths:
      - assets/**
      - content/**
      - layouts/**
      - static/**
      - hugo.toml
  workflow_dispatch:

permissions: {}

# 連続 push では最新の 1 回だけ起動すればよい
concurrency:
  group: trigger-article-deploy
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch blog-article deploy
        env:
          GH_TOKEN: ${{ secrets.ARTICLE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ARTICLE_DEPLOY_TOKEN が未設定です。Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          gh workflow run deploy.yml --repo kmmz532/blog-article --ref main
