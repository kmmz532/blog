<header class="header">
  <div class="header-inner">
    <a class="title" href="{{ "/" | relURL }}">{{ site.Params.headerTitle | default site.Title }}</a>
    <div class="header-actions">
      <a class="icon-button" href="{{ "/search/" | relURL }}" aria-label="検索" title="検索">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </a>
      {{- if and (eq .Kind "page") (eq .Section "posts") }}
      <a class="icon-button admin-only" href="{{ "/edit/" | relURL }}?slug={{ .File.ContentBaseName | urlquery }}" aria-label="この記事を編集" title="この記事を編集" hidden>
        <i class="fa-solid fa-pen" aria-hidden="true"></i>
      </a>
      {{- end }}
      <a class="icon-button admin-only" href="{{ "/edit/" | relURL }}" aria-label="新規記事" title="新規記事" hidden>
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
      </a>
      <a class="icon-button guest-only" href="{{ "/login/" | relURL }}" aria-label="ログイン" title="ログイン" hidden>
        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
      </a>
      <a class="icon-button logout-only" href="#" aria-label="ログアウト" title="ログアウト" hidden>
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</header>
