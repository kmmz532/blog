<header class="header">
  <div class="header-inner">
    <a class="title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav>
      <ul>
        <li class="wide"><a href="{{ "/tags/" | relURL }}">Tags</a></li>
        <li class="wide"><a href="{{ "/categories/" | relURL }}">Categories</a></li>
        <li><a href="{{ "/search/" | relURL }}">Search</a></li>
        <li><a href="https://kmmz.jp/" rel="noopener">kmmz.jp</a></li>
        {{- if and (eq .Kind "page") (eq .Section "posts") }}
        <li class="admin-only" hidden><a href="{{ "/edit/" | relURL }}?slug={{ .File.ContentBaseName | urlquery }}">Edit</a></li>
        {{- end }}
        <li class="admin-only" hidden><a href="{{ "/edit/" | relURL }}">New</a></li>
      </ul>
    </nav>
  </div>
</header>
