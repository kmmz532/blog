{{ define "main" }}
<div class="editor-bar">
  <a class="icon-button" id="back-link" href="{{ "/" | relURL }}" aria-label="戻る" title="戻る">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
  </a>
  <span class="spacer"></span>
  <div class="tabs" role="group" aria-label="表示切替">
    <button type="button" id="view-edit" aria-pressed="true">編集</button>
    <button type="button" id="view-preview" aria-pressed="false">プレビュー</button>
    <button type="button" id="view-split" aria-pressed="false" hidden>両方</button>
  </div>
  <span id="save-state" class="save-state" aria-live="polite"></span>
  <button type="submit" form="post-form" id="save" class="btn primary">公開</button>
</div>
<div id="notice" class="notice" role="status" hidden></div>

<form id="post-form" class="editor" autocomplete="off" data-index-url="{{ "index.json" | relURL }}">
  <div class="editor-main" id="editor-main" data-view="edit" data-kind="article">
    <div id="kind-tabs" class="kind-tabs" hidden>
      <button type="button" class="btn" data-kind="article" aria-pressed="true">記事</button>
      <button type="button" class="btn" data-kind="external" aria-pressed="false">外部記事</button>
    </div>

    <input id="f-title" class="title-input" placeholder="タイトル" aria-label="タイトル">

    <div id="external-fields" class="external-fields" hidden>
      <label class="field">URL（https://）
        <input id="f-external" type="url" placeholder="https://"></label>
      <label class="field">サイト名
        <input id="f-source" placeholder="Zenn など"></label>
    </div>

    <div id="toolbar" class="toolbar" role="toolbar" aria-label="書式">
      <button type="button" data-action="bold" aria-label="太字" title="太字"><i class="fa-solid fa-bold" aria-hidden="true"></i></button>
      <button type="button" data-action="italic" aria-label="斜体" title="斜体"><i class="fa-solid fa-italic" aria-hidden="true"></i></button>
      <button type="button" data-action="heading" aria-label="見出し" title="見出し"><i class="fa-solid fa-heading" aria-hidden="true"></i></button>
      <button type="button" data-action="link" aria-label="リンク" title="リンク"><i class="fa-solid fa-link" aria-hidden="true"></i></button>
      <button type="button" data-action="code" aria-label="コード" title="コード"><i class="fa-solid fa-code" aria-hidden="true"></i></button>
      <button type="button" data-action="image" aria-label="画像を挿入" title="画像を挿入"><i class="fa-solid fa-image" aria-hidden="true"></i></button>
      <input id="f-image" type="file" accept="image/*" hidden>
    </div>

    <div class="editor-panes">
      <textarea id="f-body" class="body-input" aria-label="本文（Markdown）" placeholder="本文を書く（Markdown）"></textarea>
      <section id="preview" class="preview-pane" aria-label="プレビュー"></section>
    </div>
  </div>

  <aside class="settings">
    <div class="settings-card">
      <h2>記事設定</h2>
      <label class="field">slug
        <span class="slug-row">
          <input id="f-slug" required pattern="[a-z0-9\-]{1,80}" maxlength="80">
          <span id="slug-auto" class="slug-auto" hidden>自動</span>
        </span></label>
      <p id="f-slug-error" class="field-error" hidden></p>
      <label class="field">投稿日時
        <input id="f-date" type="datetime-local" required></label>
      <div class="field">
        <label for="f-category">カテゴリ（「&gt;」で階層）</label>
        <input id="f-category" list="category-list" placeholder="例: 趣味 &gt; 写真" autocomplete="off">
        <datalist id="category-list"></datalist>
        <div id="category-chips" class="choices" role="group" aria-label="既存のカテゴリ"></div>
      </div>
      <div class="field">
        <span>タグ</span>
        <div id="tag-selected" class="tag-selected" aria-label="選択中のタグ"></div>
        <input id="f-tag-entry" placeholder="検索または新しいタグ（Enter）" aria-label="タグ" maxlength="40">
        <div id="tag-suggest" class="choices" aria-label="既存のタグ"></div>
      </div>
    </div>

    <details id="summary-details" class="details-card">
      <summary>概要（任意）</summary>
      <textarea id="f-summary" rows="3" placeholder="（本文から自動生成されます）"></textarea>
      <p id="summary-count" class="char-count"></p>
    </details>

    <details id="thumb-details" class="details-card">
      <summary>サムネイル</summary>
      <div class="thumb-current">
        <img id="thumb-preview" class="card-thumb" alt="" width="96" height="96" loading="lazy" hidden>
        <p id="thumb-state" class="card-meta"></p>
      </div>
      <div class="thumb-actions">
        <button type="button" id="thumb-auto" class="btn">自動</button>
        <button type="button" id="thumb-pick" class="btn">本文の画像から選ぶ</button>
        <button type="button" id="thumb-upload" class="btn">画像をアップロード</button>
        <input id="thumb-file" type="file" accept="image/*" hidden>
      </div>
      <div id="thumb-choices" class="thumb-choices" aria-label="本文の画像" hidden></div>
    </details>

    <details id="drafts-details" class="details-card drafts">
      <summary id="drafts-summary">下書き（この端末のみ）</summary>
      <div id="draft-pending" class="draft-pending" hidden>
        <p id="draft-pending-text"></p>
        <button type="button" id="draft-restore" class="btn primary">復元する</button>
        <button type="button" id="draft-drop" class="btn">破棄する</button>
      </div>
      <ul id="drafts"></ul>
      <button type="button" id="discard" class="btn">この下書きを破棄</button>
    </details>

    <details id="danger-details" class="details-card" hidden>
      <summary>危険な操作</summary>
      <button type="button" id="delete" class="btn danger">この記事を削除</button>
    </details>
  </aside>
</form>
{{ end }}


{{ define "scripts" }}
<script src="{{ "lib/marked.min.js" | relURL }}" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"></script>
<script type="module" src="{{ "js/editor.js" | relURL }}"></script>
{{ end }}
