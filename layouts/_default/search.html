{{ define "main" }}
<h1 class="page-title">検索</h1>
<form id="search-form" class="search-box" role="search">
  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
  <input id="q" type="search" placeholder="ブログ内の記事を検索" aria-label="検索キーワード">
</form>
<p id="search-count" class="card-meta" aria-live="polite"></p>
<div id="search-results" class="card-list" data-index-url="{{ "index.json" | relURL }}"></div>
{{ end }}

{{ define "scripts" }}
<script type="module" src="{{ "js/search.js" | relURL }}"></script>
{{ end }}
