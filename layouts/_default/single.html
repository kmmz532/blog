{{ define "main" }}
<article class="post" data-slug="{{ .File.ContentBaseName }}">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="card-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006.01.02" }}</time>
      {{- range .Params.categories }}
      <a class="chip" href="{{ "/categories/" | relURL }}{{ . | urlize }}/">{{ . }}</a>
      {{- end }}
    </p>
    {{- with .Params.tags }}
    <p class="card-tags">
      {{- range . }}
      <a class="chip" href="{{ "/tags/" | relURL }}{{ . | urlize }}/">#{{ . }}</a>
      {{- end }}
    </p>
    {{- end }}
    <p><a class="admin-only btn" href="{{ "/edit/" | relURL }}?slug={{ .File.ContentBaseName | urlquery }}" hidden>この記事を編集</a></p>
  </header>
  <div class="post-body">{{ .Content }}</div>
</article>
{{ end }}
