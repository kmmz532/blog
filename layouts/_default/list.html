{{ define "main" }}
{{- $pag := .Paginate (where site.RegularPages "Section" "posts") }}
<form id="search-form" class="search-box home-search" action="{{ "/search/" | relURL }}" method="get" role="search">
  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
  <input id="q" type="search" name="q" aria-label="検索キーワード" placeholder="タイトル、タグ、本文から検索" autocomplete="off">
</form>
<p id="search-count" class="card-meta" aria-live="polite"><span id="search-count-text"></span><span id="search-spinner" class="search-spinner" role="img" aria-label="読み込み中" hidden></span></p>
<div id="search-results" class="card-list" data-index-url="{{ "index.json" | relURL }}"></div>
<div id="home-list">
  {{- partial "pager.html" $pag }}
  <div class="card-list" data-pending-target="list">
    {{- range $pag.Pages }}
    {{- partial "post-card.html" . }}
    {{- else }}
    <p>記事はまだありません。</p>
    {{- end }}
  </div>
  {{- partial "pager.html" $pag }}
</div>
{{ end }}

{{ define "scripts" }}
<script type="module" src="{{ "js/search.js" | relURL }}"></script>
{{ end }}
