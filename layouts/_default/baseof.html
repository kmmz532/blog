<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="contents">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <div class="options">
    <button type="button" id="theme-toggle" aria-label="ダークモードを切り替える">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
  <script src="{{ "js/theme.js" | relURL }}" type="module"></script>
  <script src="{{ "js/admin.js" | relURL }}" type="module"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
