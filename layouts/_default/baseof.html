<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <div class="layout">
    <main class="contents">
      {{ block "main" . }}{{ end }}
    </main>
    {{- if not (or (eq .Kind "404") (eq (.Params.sidebar | default true) false)) }}
    {{ partial "sidebar.html" . }}
    {{- end }}
  </div>
  {{ partial "footer.html" . }}
  <div class="options">
    <button type="button" id="theme-toggle" aria-label="ダークモードを切り替える" title="ダークモードを切り替える">
      <i class="fa-solid fa-moon icon" aria-hidden="true"></i>
    </button>
  </div>
  <script src="{{ "js/theme.js" | relURL }}" type="module"></script>
  <script src="{{ "js/admin.js" | relURL }}" type="module"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
