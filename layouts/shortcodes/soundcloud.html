{{- /* {{< soundcloud url="https://soundcloud.com/ユーザー/曲" >}}: SoundCloud の曲を iframe で埋め込む（design.md §18） */ -}}
{{- $url := .Get "url" -}}
{{- if findRE `^https://soundcloud\.com/[^/\s"]+/[^/\s"]+` $url -}}
<div class="audio-embed"><iframe src="https://w.soundcloud.com/player/?url={{ $url | urlquery }}" title="SoundCloud の曲" loading="lazy"></iframe></div>
{{- else -}}
<a href="{{ $url }}" target="_blank" rel="noopener">{{ $url }}</a>
{{- end -}}
