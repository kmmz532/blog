baseURL = "https://blog.kmmz.jp/"
languageCode = "ja"
timeZone = "Asia/Tokyo"
title = "かみみずブログ"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[caches.getresource]
  maxAge = "24h"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false

[params]
  description = "Kmmz1127の個人ブログです！"
  headerTitle = "Kmmz1127 Blog"
  repo = "kmmz532/blog-article"
  branch = "main"
  author = "Mizuto, Kaminakano"
  bio = "ウェブ開発やアプリ開発に興味のある大学生"
  footer = "© 2025-2026 Mizuto, Kaminakano | contact@kmmz.jp - Osaka, Japan"

# サイドバーのリンク (URLが空であれば非表示)
[[params.links]]
  name = "ホームページ"
  url = "https://kmmz.jp/"
  icon = "fa-solid fa-house"
[[params.links]]
  name = "GitHub"
  url = "https://github.com/kmmz532"
  icon = "fa-brands fa-github"
[[params.links]]
  name = "X.com"
  url = "https://x.com/kmmz1127"
  icon = "fa-brands fa-x-twitter"

# 記事は別リポジトリ blog-article を posts/ に clone して取り込む
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "posts/content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "posts/static"
  target = "static"
