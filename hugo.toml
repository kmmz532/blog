title = "かみみずブログ"
baseURL = "https://blog.kmmz.jp/"
languageCode = "ja"
timeZone = "Asia/Tokyo"
# ogp.md が link-card の URL を 1 回のテンプレート実行で全部取りに行くため、取得が遅いと既定の 30 秒を超える
timeout = "5m"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[caches.getresource]
  maxAge = "24h"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  # 数式。インラインは \(...\) だけ（本文の $ を誤認しないため）
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['\(', '\)']]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  # 索引（/index.json・/gh-admin/index.json）の 1 ファイルの件数。2 つ目以降は /index/2.json のように分ける
  indexPageSize = 50
  description = "Kmmz1127の個人ブログです！"
  # 記事カードのデフォルトサムネイル（任意。/default-thumbnail.png の形）。未設定なら画像なし
  defaultThumbnail = ""
  # 画像の無い記事の og:image（任意。/images/... の形）。未設定なら出さない
  # ogImage = "/images/ogp.png"
  headerTitle = "Kmmz-Blog"
  icon = "/favicon.ico"
  appleIcon = "/apple-touch-icon.png"
  # Cloudflare Web Analytics のトークン（任意）
  cfAnalyticsToken = "1804f0b089514bd89f825935e08c428f"
  author = "Mizuto, Kaminakano"
  bio = "ウェブ開発やアプリ開発に興味のある大学生"
  footer = "© 2025-2026 Mizuto, Kaminakano - CC BY 4.0. | contact@kmmz.jp - Osaka, Japan"

# 管理画面（gh-admin）の設定。未設定の項目は layouts/partials/gh-admin/settings.html の既定値
[params.ghAdmin]
  lang = "ja"
  repo = "kmmz532/blog-article"
  branch = "main"
  siteRepo = "kmmz532/blog"
  siteBranch = "main"
  siteConfigPath = "hugo.toml"

# サイドバーのリンク (URLが空であれば非表示)
[[params.links]]
  name = "ホームページ"
  url = "https://kmmz.jp/"
  icon = "fa-solid fa-house"
[[params.links]]
  name = "GitHub"
  url = "https://github.com/kmmz532"
  icon = "fa-brands fa-github"
[[params.links]]
  name = "X.com"
  url = "https://x.com/kmmz1127"
  icon = "fa-brands fa-x-twitter"
[[params.links]]
  name = "Facebook"
  url = "https://www.facebook.com/profile.php?id=61572863020497&ref=_ig_profile_ac"
  icon = "fa-brands fa-facebook"
[[params.links]]
  name = "Instagram"
  url = "https://www.instagram.com/_miz210/"
  icon = "fa-brands fa-instagram"

# 管理画面の機能は Hugo Modules の部品（版はタグで固定。go.mod に記録）
[[module.imports]]
  path = "github.com/kmmz532/hugo-gh-admin"

# Hugo のショートコード・描画フック・OGP 索引（記事の書式）
[[module.imports]]
  path = "github.com/kmmz532/hugo-shortcodes"

# 記事は別リポジトリ blog-article を posts/ に clone して取り込む
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "posts/content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "posts/static"
  target = "static"
